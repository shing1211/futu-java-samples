name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Compile
      run: mvn -B compile --file pom.xml

    - name: Test
      run: mvn -B test --file pom.xml

    - name: Package
      run: mvn -B package -DskipTests --file pom.xml
